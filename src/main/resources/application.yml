server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/library
    username: library
    password: library
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jackson:
    serialization:
      write-dates-as-timestamps: false

library:
  kv:
    key-prefix: /library
    draft-ttl-seconds: 300
  etcd:
    endpoint: ${ETCD_ENDPOINT:http://localhost:2379}
  cache:
    user-settings-ttl-seconds: 600
    user-settings-max-size: 1000
  demo-data: true

logging:
  level:
    ru.library: INFO